name: ci

# One repository, seven packages, one place GitHub actually looks.
#
# Until this file existed the workflows lived under packages/*/.github/, which is
# where they sat when each part was its own repository. GitHub only reads
# .github/workflows/ at the root, so after the merge not one of them ran — three
# CI files, three release files, zero runs, and nothing said so.

on: [push, pull_request]

jobs:
  frame:
    # The parts that are plain ESM and declare engines >=18. orogami declared the
    # same floor, was broken on 18, on 20.18 and on 22.0-22.6, and its single Node
    # 20 job stayed green throughout: the break was not monotonic, so one version
    # cannot stand in for the others.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']
        package: [spar, redline, carbon, airframe, groundtruth, habit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm ci, not npm install: it installs the tree package-lock.json names and
      # nothing else. With `npm install` the resolution happened again on every
      # run, so a devDependency's own release could turn this red on a day nobody
      # touched the code — a red build that says nothing about the commit under it
      # is worse than no build. The lockfile is committed for exactly this; npm
      # leaves it out of the published tarball on its own, so it costs consumers
      # nothing.
      - run: npm ci --no-audit --no-fund
      - run: npm test --workspace=packages/${{ matrix.package }}

  sql:
    # llm-safe-sql is the one part that is TypeScript, needs Node 20+, and has
    # tests that only mean anything against a real database.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: llmsafesql
          MYSQL_DATABASE: llmsafesql
        ports: ['13306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pllmsafesql"
          --health-interval=3s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: llmsafesql
          POSTGRES_DB: llmsafesql
        ports: ['15432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d llmsafesql"
          --health-interval=3s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspace=packages/llm-safe-sql
      - run: npm test --workspace=packages/llm-safe-sql
      - run: npm run test:integration --workspace=packages/llm-safe-sql

  dogfood:
    # groundtruth verifies its own claim by RE-FETCHING reality: re-import the
    # module and count its exports. The tool must survive being pointed at itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      # Run in place rather than through `npm run --workspace`: the probe is a
      # nested-quoted `node -e`, and putting another shell between it and the
      # runner is how that stops meaning what it says.
      - working-directory: packages/groundtruth
        run: node src/cli.mjs verify --probe "node -e \"import('./src/index.mjs').then(m=>process.stdout.write(String(Object.keys(m).length)))\"" --at-least 4
      # habit's own agent config is checked by the linter it ships alongside. The
      # package is scoped; `tenken` is only the bin name, so bare `npx tenken`
      # looks up a package that does not exist and 404s.
      - run: npx @hyuga/tenken packages/habit/AGENTS.md

  coverage:
    # A floor, not a target. The point is to notice a whole file arriving with no
    # tests behind it, which is how the four CLIs in this repository went
    # unexecuted until somebody thought to measure — spar, redline, carbon and
    # airframe all had their entire command table at zero, in a repository where
    # two other parts had already shipped a CLI that did nothing and exited 0.
    #
    # The numbers sit a few points under where every package actually is
    # (lowest today: 86.48 lines, 71.51 branches, 87.41 functions). Set at the
    # current reading they would go red on an ordinary change and get raised
    # until they meant nothing.
    #
    # --test-coverage-include=src/** because the default counts whatever was
    # imported: a package that depends on spar otherwise reports spar's lines as
    # its own, and the number moves when a dependency changes.
    #
    # llm-safe-sql is absent. It compiles to dist/ and runs through its own
    # runner, so what node would measure there is generated output.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [spar, redline, carbon, airframe, groundtruth, habit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The thresholds are Node 22+. The packages themselves still declare
          # >=18, and the `frame` job above is what checks that.
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - working-directory: packages/${{ matrix.package }}
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='src/**'
          --test-coverage-lines=80
          --test-coverage-branches=65
          --test-coverage-functions=80

  lint:
    # Correctness rules only, no formatter. Each package's biome.jsonc records
    # which rules are off and why.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [groundtruth, habit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --workspace=packages/${{ matrix.package }}
