name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test

  dogfood:
    # narai's own agent config is checked by the linters it ships alongside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: tenken self-check
        # The package is scoped; `tenken` is only the bin name, so bare `npx tenken`
        # looks up a package that does not exist and 404s.
        run: npx @hyuga/tenken AGENTS.md
