name: Release

# Publishing by hand works until the day it does not: the tag says one version,
# package.json says another, and the tarball that reaches everyone was built from
# a working tree nobody can reconstruct. This runs the whole suite first, refuses
# to publish anything whose version numbers disagree, and attaches provenance so
# that "this package came from this commit" is a checkable statement rather than
# something the reader has to take on trust.
on:
  push:
    # v0 / v1 are moving major tags, not releases. Matching them here would
    # start a release run on every major-tag move and fail the version check.
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: llmsafesql
          MYSQL_DATABASE: llmsafesql
        ports: ['13306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pllmsafesql"
          --health-interval=3s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: llmsafesql
          POSTGRES_DB: llmsafesql
        ports: ['15432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d llmsafesql"
          --health-interval=3s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci

      # Three places carry the version and all three have to agree. The one that
      # gets forgotten is src/version.ts, which the MCP server reports to its
      # client -- a stale value there is a lie that is very hard to notice.
      - name: The tag, package.json and version.ts must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/'([^']+)'/)[1]")
          echo "tag=$TAG package.json=$PKG version.ts=$SRC"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }
          test "$TAG" = "$SRC" || { echo "::error::tag $TAG does not match src/version.ts $SRC"; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

      - name: The published tarball must not contain a config or a dump
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if grep -Eq '"path": *"(.*\.config\.json|.*\.sql|.*\.env)"' /tmp/pack.json; then
            echo "::error::a configuration file, SQL dump or env file is in the package"
            exit 1
          fi

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub release
      id-token: write   # to sign the provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Provenance and trusted publishing both need a recent npm; the version
      # bundled with the runner's Node is not always new enough.
      - run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN is set on purpose: with a trusted publisher configured
      # on npmjs.com for this repository and workflow, npm authenticates with the
      # workflow's OIDC identity and there is no long-lived credential to leak. If
      # you would rather use a token, add NPM_TOKEN as a secret and set
      # NODE_AUTH_TOKEN from it here.
      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed.

          Published with [provenance](https://docs.npmjs.com/generating-provenance-statements): the npm package is attested to have been built from this commit by this workflow." \
            --verify-tag
