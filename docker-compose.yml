# Databases for the integration tests.
#
# The dry-run engine's whole claim is "we really executed it and really rolled it
# back". You cannot test that against a mock: the behaviour under test *is* the
# engine's transaction semantics. So the tests need real servers, and CI runs the
# same two images.
#
#   docker compose up -d
#   npm run test:integration
#
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: llmsafesql
      MYSQL_DATABASE: llmsafesql
    command:
      # InnoDB only — a non-transactional engine would silently "succeed" at
      # rollback while changing nothing back, which is the one failure this
      # library must never have.
      - --default-storage-engine=InnoDB
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - '13306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pllmsafesql']
      interval: 3s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: llmsafesql
      POSTGRES_DB: llmsafesql
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d llmsafesql']
      interval: 3s
      timeout: 5s
      retries: 30
